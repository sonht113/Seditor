name: 🐛 Bug report
description: Report a bug in Seditor
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Seditor version
      placeholder: "0.0.0"
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework binding
      options:
        - React (@seditor/editor-react)
        - Core only (@seditor/editor-core)
        - Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "OS, browser, Node version"
